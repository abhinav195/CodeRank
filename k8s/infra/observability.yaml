apiVersion: v1
kind: Service
metadata:
  name: coderank-jaeger
spec:
  selector:
    app: coderank-jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coderank-jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coderank-jaeger
  template:
    metadata:
      labels:
        app: coderank-jaeger
    spec:
      containers:
        - name: coderank-jaeger
          image: jaegertracing/all-in-one:1.76.0
          ports:
            - containerPort: 16686
            - containerPort: 4317
            - containerPort: 4318
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: "coderank-auth"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["coderank-auth:8081"]
      - job_name: "coderank-problem"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["coderank-problem:8082"]
      - job_name: "coderank-submission"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["coderank-submission:8083"]
      - job_name: "coderank-execution"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["coderank-execution:8084"]
      - job_name: "coderank-result-processor"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["coderank-result-processor:8085"]
      - job_name: "coderank-gateway"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["coderank-gateway:8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.5
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data