# ════════════════════════════════════════════════════════════════════════
# CODERANK-AUTH
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: coderank-auth-config
data:
  DB_HOST: "postgres-auth"
  DB_PORT: "5432"
  DB_USERNAME: "postgres"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: coderank-auth-secret
type: Opaque
stringData:
  DB_PASSWORD: "abhinav195"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coderank-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coderank-auth
  template:
    metadata:
      labels:
        app: coderank-auth
    spec:
      containers:
        - name: coderank-auth
          image: coderank-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: coderank-auth-config
            - secretRef:
                name: coderank-auth-secret
            - secretRef:
                name: coderank-jwt-secret
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: coderank-auth
spec:
  type: NodePort
  selector:
    app: coderank-auth
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
---
